<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sismos MX — Mapa sísmico en tiempo real</title>
    <meta
      name="description"
      content="Mapa de sismos en tiempo real enfocado en México, con datos en vivo del USGS. Sin cuenta, sin servidor."
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="app-header">
      <h1>🌎 Sismos MX</h1>
      <p class="subtitle">Actividad sísmica en tiempo real — datos oficiales del USGS</p>
    </header>

    <div id="controls">
      <div class="control-group">
        <label for="region-select">Región</label>
        <select id="region-select">
          <option value="mexico" selected>México</option>
          <option value="global">Global</option>
        </select>
      </div>

      <div class="control-group">
        <label for="period-select">Período</label>
        <select id="period-select">
          <option value="hour">Última hora</option>
          <option value="day" selected>Últimas 24 horas</option>
          <option value="week">Última semana</option>
        </select>
      </div>

      <div class="control-group">
        <label for="mag-range">Magnitud mínima: <span id="mag-value">0</span></label>
        <input type="range" id="mag-range" min="0" max="7" step="0.5" value="0" />
      </div>

      <div class="control-group control-checkbox">
        <label><input type="checkbox" id="historic-toggle" /> Mostrar sismos históricos de referencia</label>
      </div>

      <button id="refresh-btn" type="button">Actualizar ahora</button>
      <span id="status-text"></span>
    </div>

    <main>
      <div id="map"></div>
      <aside id="sidebar">
        <h2>Lista de sismos</h2>
        <ul id="quake-list"></ul>
      </aside>
    </main>

    <footer>
      Datos: <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS Earthquake Hazards Program</a>.
      Actualiza automáticamente cada 5 minutos. Código abierto en
      <a href="https://github.com/mxnueel/sismos-mx" target="_blank" rel="noopener">GitHub</a>.
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
